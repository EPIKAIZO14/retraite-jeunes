<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Liste des Inscrits - Admin</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container wide">
        <h2>Liste des Jeunes Enregistrés</h2>
        <table>
            <thead>
                <tr>
                    <th>Nom</th>
                    <th>Post-nom</th>
                    <th>Prénom</th>
                    <th>Genre</th>
                    <th>Téléphone</th>
                    <th>Adresse</th>
                </tr>
            </thead>
            <tbody>
                {% for jeune in enregistrements %}
                <tr>
                    <td>{{ jeune.nom }}</td>
                    <td>{{ jeune.post_nom }}</td>
                    <td>{{ jeune.prenom }}</td>
                    <td>{{ jeune.genre }}</td>
                    <td>{{ jeune.telephone }}</td>
                    <td>{{ jeune.adresse }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        <br>
        <a href="/">Retour au formulaire</a>
    </div>
</body>
</html>
