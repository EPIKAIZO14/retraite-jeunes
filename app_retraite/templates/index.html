<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - Retraite des Jeunes</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
            max-width: 450px;
            width: 100%;
            text-align: center;
            border: 1px solid #333;
        }
        h2 {
            color: #3b82f6;
            margin-bottom: 10px;
            font-size: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .titre-eglise {
            color: #ffffff;
            margin-top: 5px;
            margin-bottom: 15px;
            font-weight: 800;
            font-size: 22px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .logo {
            max-width: 140px;
            height: auto;
            margin-top: 5px;
            margin-bottom: 25px;
            border-radius: 10px;
        }
        .alert {
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 14px;
        }
        .alert-success {
            background-color: #1b4332;
            color: #d8f3dc;
            border: 1px solid #2d6a4f;
        }
        .alert-danger {
            background-color: #4a151b;
            color: #ffccd5;
            border: 1px solid #a4133c;
        }
        .form-group {
            text-align: left;
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 6px;
            color: #bbb;
            font-size: 14px;
        }
        input, select {
            width: 100%;
            padding: 12px;
            background-color: #2a2a2a;
            color: #fff;
            border: 1px solid #444;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        input::placeholder {
            color: #777;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #3b82f6;
            background-color: #333;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #3b82f6;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #2563eb;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Liste d'enregistrement des jeunes pour la retraite</h2>

    <div class="titre-eglise">PAROLE ETERNEL NGIRI NGIRI</div>

    <img src="/image.png" alt="Logo PAROLE" class="logo" 
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category }}">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form action="/ajouter" method="POST" autocomplete="off">
        <div class="form-group">
            <label>Nom</label>
            <input type="text" name="nom" placeholder="Ex: NDOMBE" required>
        </div>

        <div class="form-group">
            <label>Post-nom</label>
            <input type="text" name="postnom" placeholder="Ex: MABONGA" required>
        </div>

        <div class="form-group">
            <label>Prénom</label>
            <input type="text" name="prenom" placeholder="Ex: Emeraude" required>
        </div>

        <div class="form-group">
            <label>Genre (Sexe)</label>
            <select name="genre" required>
                <option value="">Choisir le genre...</option>
                <option value="M">Masculin</option>
                <option value="F">Féminin</option>
            </select>
        </div>

        <div class="form-group">
            <label>Numéro de Téléphone</label>
            <input type="tel" name="telephone" placeholder="Ex: 0993686916" required>
        </div>

        <div class="form-group">
            <label>Adresse Résidentielle</label>
            <input type="text" name="adresse" placeholder="Ex: Q/ELENGESA C/NGIRI NGIRI N°9" required>
        </div>

        <button type="submit">Enregistrer</button>
    </form>
</div>

</body>
</html>
