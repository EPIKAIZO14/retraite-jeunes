<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion Administration</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background-color: #1e1e1e; padding: 30px; border-radius: 10px; width: 100%; max-width: 400px; text-align: center; border: 1px solid #333; }
        h2 { color: #3b82f6; margin-bottom: 20px; }
        input[type="password"] { width: 100%; padding: 12px; margin: 10px 0; border-radius: 6px; border: 1px solid #444; background-color: #2a2a2a; color: white; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background-color: #3b82f6; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        button:hover { background-color: #2563eb; }
        .alert-danger { background-color: #4a151b; color: #ffccd5; padding: 10px; border-radius: 6px; margin-bottom: 15px; border: 1px solid #a4133c; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Espace Administrateur</h2>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ category }}">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form action="/admin" method="POST">
            <label for="password">Mot de passe :</label>
            <input type="password" id="password" name="password" placeholder="Entrez le mot de passe" required>
            <button type="submit">Se connecter</button>
        </form>
    </div>
</body>
</html>
